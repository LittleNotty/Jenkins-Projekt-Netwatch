# NetWatch-Deployment: Jenkins erzeugt DB_NAME aus Version.txt und übergibt
# die DB-Zugangsdaten aus Jenkins Credentials beim Containerstart.
# Die vorhandene MariaDB mit ihrem Volume bleibt unangetastet.
# ACHTUNG: Nicht blind auf einer ungeprüften Docker-Umgebung ausführen.
services:
  netwatch-db:
    # Bestehendes MariaDB-Image, über die einmalige Migration lokal markiert.
    image: mariadb:netwatch-existing
    pull_policy: never
    container_name: netwatch-db
    restart: unless-stopped
    # Persistentes, bereits initialisiertes Volume: NICHT ersetzen oder löschen.
    volumes:
      - netwatch-db-data:/var/lib/mysql
    networks:
      - netwatch-net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 15s
      interval: 10s
      timeout: 5s
      retries: 6

  netwatch:
    image: ${IMAGE_TAG:-netwatch:latest}
    container_name: netwatch
    restart: "no"
    depends_on:
      netwatch-db:
        condition: service_healthy
    environment:
      DB_HOST: netwatch-db
      # Absichtlich kein DB-Default: ein fehlender Versionsname ist ein Fehler.
      # Leer ist fuer die frühe Jenkins-Compose-Syntaxprüfung erlaubt;
      # netwatch.sh beendet sich dann kontrolliert mit einer Fehlermeldung.
      DB_NAME: ${DB_NAME:-}
      DB_USER: ${DB_USER:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
      NETWATCH_VERSION: ${NETWATCH_VERSION:-}
      NETWATCH_BUILD: ${NETWATCH_BUILD:-}
      NETWATCH_COMMIT: ${NETWATCH_COMMIT:-}
      CHECK_INTERVAL: "60"
      MAX_RUNTIME_SECONDS: "3600"
    networks:
      - netwatch-net

volumes:
  netwatch-db-data:
    external: true
    name: netwatch-db-data

networks:
  netwatch-net:
    external: true
    name: netwatch-net
